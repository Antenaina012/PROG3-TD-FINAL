openapi: 3.0.3
info:
  title: Madagascar Agricultural Collectivities Federation API
  description: |
    REST API for managing the national federation of agricultural collectivities in Madagascar.
    
    This version includes:
    - **A**: Opening of new collectivities
    - **B**: Member admission and management (including B-2 update from 04/21/2026)
    - **C**: Dues and payments
    - **D**: Treasury and cash flow status
    - **E**: Collectivity and federation activities
    - **F**: Attendance tracking
    - **G**: Collectivity statistics
    - **H**: Federation-wide statistics (Global reports)
  version: 1.1.0
  contact:
    name: Agricultural Federation of Madagascar

tags:
  - name: Collectivities
    description: Management of agricultural groups (Functionality A)
  - name: Members
    description: Admission and member lifecycle (Functionality B & B-2)
  - name: Dues
    description: Membership fees and payments (Functionality C)
  - name: Treasury
    description: Accounts and financial status (Functionality D)
  - name: Activities
    description: Event planning and scheduling (Functionality E)
  - name: Attendance
    description: Tracking presence at activities (Functionality F)
  - name: Statistics
    description: Collectivity-level reports (Functionality G)
  - name: Federation Statistics
    description: Global federation reports (Functionality H)

# ==============================================================================
# PATHS
# ==============================================================================
paths:

  # ============================================================
  # A - COLLECTIVITIES
  # ============================================================
  /collectivities:
    get:
      tags: [Collectivities]
      summary: List all collectivities
      operationId: getCollectivities
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: specialty
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of collectivities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectivityListResponse'

    post:
      tags: [Collectivities]
      summary: Request the opening of a new collectivity
      description: |
        Conditions:
        - At least 10 members (5 with 6+ months seniority)
        - Specific roles filled (President, Treasurer, etc.)
      operationId: createCollectivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectivityCreationRequest'
      responses:
        '201':
          description: Opening request submitted successfully

  # ============================================================
  # B - MEMBERS (Updated B-2)
  # ============================================================
  /members:
    post:
      tags: [Members]
      summary: Register a new member
      description: |
        Conditions (Update B-2):
        - Minimum 2 confirmed sponsors.
        - Target collectivity sponsors >= External sponsors.
        - Payment: 50,000 MGA fee + full annual dues.
      operationId: registerMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRegistrationRequest'
      responses:
        '201':
          description: Member successfully registered

  /members/{memberId}/transfer:
    put:
      tags: [Members]
      summary: Transfer to another collectivity
      parameters:
        - $ref: '#/components/parameters/memberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetCollectivityId, reason]
              properties:
                targetCollectivityId: { type: string, format: uuid }
                reason: { type: string }
      responses:
        '200':
          description: Transfer completed

  # ============================================================
  # C & D - TREASURY
  # ============================================================
  /collectivities/{collectivityId}/payments:
    post:
      tags: [Dues]
      summary: Record a payment (dues)
      parameters:
        - $ref: '#/components/parameters/collectivityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Payment recorded

  /collectivities/{collectivityId}/accounts:
    get:
      tags: [Treasury]
      summary: Get accounts and balance
      parameters:
        - $ref: '#/components/parameters/collectivityId'
      responses:
        '200':
          description: Financial status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'

  # ============================================================
  # E & F - ACTIVITIES & ATTENDANCE
  # ============================================================
  /activities/{activityId}/attendance:
    post:
      tags: [Attendance]
      summary: Record member attendance (Functionality F)
      parameters:
        - $ref: '#/components/parameters/activityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AttendanceEntry'
      responses:
        '200':
          description: Attendance recorded

  # ============================================================
  # G & H - STATISTICS
  # ============================================================
  /collectivities/{collectivityId}/member-stats:
    get:
      tags: [Statistics]
      summary: Detailed member statistics (Functionality G)
      parameters:
        - $ref: '#/components/parameters/collectivityId'
        - name: startDate
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Statistics retrieved

  /federation/reports/global:
    get:
      tags: [Federation Statistics]
      summary: Global Federation Report (Functionality H)
      description: Recenses attendance rates, payment compliance, and new members globally.
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, enum: [monthly, yearly] }
      responses:
        '200':
          description: Global report generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationReportResponse'

# ==============================================================================
# COMPONENTS
# ==============================================================================
components:
  parameters:
    collectivityId:
      name: collectivityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    memberId:
      name: memberId
      in: path
      required: true
      schema: { type: string, format: uuid }
    activityId:
      name: activityId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    CollectivityCreationRequest:
      type: object
      required: [name, city, specialty, foundingMembers]
      properties:
        name: { type: string }
        city: { type: string }
        specialty: { type: string }
        foundingMembers:
          type: array
          minItems: 10
          items: { type: string, format: uuid }

    MemberRegistrationRequest:
      type: object
      required: [firstName, lastName, sponsors, initialPayment]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        birthDate: { type: string, format: date }
        sponsors:
          type: array
          minItems: 2
          items:
            type: object
            properties:
              memberId: { type: string, format: uuid }
              relationship: { type: string }
        initialPayment:
          type: object
          properties:
            admissionFee: { type: number, example: 50000 }
            annualDues: { type: number }

    AccountResponse:
      type: object
      properties:
        type: { type: string, enum: [CASH, BANK, MOBILE_MONEY] }
        balance: { type: number }
        bankName: { type: string }

    AttendanceEntry:
      type: object
      required: [memberId, status]
      properties:
        memberId: { type: string, format: uuid }
        status: { type: string, enum: [PRESENT, ABSENT, EXCUSED] }
        motive: { type: string }

    FederationReportResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              collectivityId: { type: string, format: uuid }
              attendanceRate: { type: number }
              complianceRate: { type: number }
              newMemberCount: { type: integer }

    PaymentRequest:
      type: object
      required: [amount, date, method]
      properties:
        amount: { type: number }
        date: { type: string, format: date }
        method: { type: string, enum: [CASH, TRANSFER, MOBILE_MONEY] }

    CollectivityListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }

  responses:
    BadRequest:
      description: Invalid request.
    NotFound:
      description: Resource not found.
    UnprocessableEntity:
      description: Business logic error (e.g., insufficient sponsors).